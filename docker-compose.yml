services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_DB: chatapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://chatapp:chatapp@postgres:5432/chatapp
      DIRECT_URL: postgresql://chatapp:chatapp@postgres:5432/chatapp
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"
    restart: unless-stopped

volumes:
  postgres_data:
